name: VPN with Cloudflared

on:
  workflow_dispatch:
  repository_dispatch:
    types: [create-vpn]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Cài đặt Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io

      - name: Cài đặt Cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64

      - name: Chạy OpenVPN server
        run: |
          mkdir -p ~/openvpn-data
          docker run -v ~/openvpn-data:/etc/openvpn --rm kylemanna/openvpn ovpn_genconfig -u tcp://localhost:1194
          docker run -v ~/openvpn-data:/etc/openvpn --rm -it kylemanna/openvpn ovpn_initpki nopass
          docker run -d --name openvpn --cap-add=NET_ADMIN \
            -v ~/openvpn-data:/etc/openvpn -p 1194:1194/tcp \
            kylemanna/openvpn

      - name: Chạy Cloudflared tunnel ngầm
        run: |
          nohup ./cloudflared-linux-amd64 tunnel --url tcp://localhost:1194 > cf.log 2>&1 &
          sleep 10
          cat cf.log

      - name: Lấy URL từ Cloudflared
        id: geturl
        run: |
          URL=$(grep -o "trycloudflare.com:[0-9]*" cf.log | head -n 1)
          echo "PUBLIC_URL=$URL" >> $GITHUB_ENV
          echo "✅ URL: $URL"

      - name: Tạo client.ovpn với URL Cloudflare
        run: |
          docker run -v ~/openvpn-data:/etc/openvpn --rm kylemanna/openvpn easyrsa build-client-full client1 nopass
          docker run -v ~/openvpn-data:/etc/openvpn --rm kylemanna/openvpn ovpn_getclient client1 > client.ovpn
          sed -i "s/remote .*/remote $PUBLIC_URL/" client.ovpn
          echo "========== Final OVPN =========="
          cat client.ovpn

      - name: Ping server để dọn file cũ
        run: |
          echo "🧹 Đang dọn file VPN cũ trên server..."
          curl -s "https://web-server.x10.mx/vpn/index.php?ping=1"
          sleep 10s

      - name: Upload file .ovpn lên FTP server
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: web-server.x10.mx
          username: thanh2009@web-server.x10.mx
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /home/blercvom/domains/web-server.x10.mx/public_html/vpn
