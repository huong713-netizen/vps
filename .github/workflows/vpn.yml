name: VPN Server with Cloudflared

on:
  workflow_dispatch:
  repository_dispatch:
    types: [create-vpn]
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Docker
        run: |
          sudo apt update
          sudo apt install -y docker.io

      - name: Setup OpenVPN (Docker)
        run: |
          mkdir -p ~/openvpn-data
          docker run -v ~/openvpn-data:/etc/openvpn --rm kylemanna/openvpn ovpn_genconfig -u tcp://localhost:1194
          docker run -v ~/openvpn-data:/etc/openvpn --rm -it kylemanna/openvpn ovpn_initpki nopass
          docker run -v ~/openvpn-data:/etc/openvpn --rm kylemanna/openvpn easyrsa build-client-full client1 nopass
          docker run -v ~/openvpn-data:/etc/openvpn --rm kylemanna/openvpn ovpn_getclient client1 > client.ovpn
      - name: Run OpenVPN Server
        run: |
          docker run -d --name openvpn --cap-add=NET_ADMIN \
            -v ~/openvpn-data:/etc/openvpn -p 1194:1194/tcp \
            kylemanna/openvpn

      - name: Install Cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Configure Cloudflared Tunnel
        run: |
          mkdir -p ~/.cloudflared
          cat > ~/.cloudflared/config.yml <<EOF
          tunnel: openvpn-tunnel
          credentials-file: /root/.cloudflared/openvpn-tunnel.json

          ingress:
            - hostname: vpn-tcp.web-server.x10.mx
              service: tcp://localhost:1194
            - hostname: vpn-443.web-server.x10.mx
              service: tcp://localhost:443
            - service: http_status:404
          EOF

      - name: Run Cloudflared
        run: |
          nohup cloudflared tunnel --config ~/.cloudflared/config.yml run openvpn-tunnel &

      - name: Upload .ovpn to FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: web-server.x10.mx
          username: thanh2009@web-server.x10.mx
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /home/blercvom/domains/web-server.x10.mx/public_html/vpn
